name: 持仓中报核验（光迅8/20 + 中天8/28）

on:
  schedule:
    # 光迅科技：北京8/20 19:30 = UTC 11:30（中报预披露日当天盘后核验）
    - cron: "30 11 20 8 *"
    # 中天科技：北京8/28 19:30 = UTC 11:30
    - cron: "30 11 28 8 *"
  workflow_dispatch:
    inputs:
      target:
        description: "核验标的"
        required: true
        default: "zt"
        type: choice
        options: [zt, gx]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 判定核验标的
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "t=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 11 20 8 *" ]; then
            echo "t=gx" >> "$GITHUB_OUTPUT"
          else
            echo "t=zt" >> "$GITHUB_OUTPUT"
          fi

      - name: 核验并推送中报结论
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ steps.target.outputs.t }}" = "gx" ]; then
            export VERIFY_CODE=002281 VERIFY_NAME=光迅科技 \
                   FORECAST_LOW=5.586 VERIFY_OK=5.9 FORECAST_HIGH=6.15 \
                   LAST_YEAR_H1=3.724 DISCLOSE_DATE=2026-08-20
          else
            export VERIFY_CODE=600522 VERIFY_NAME=中天科技 \
                   FORECAST_LOW=23.52 VERIFY_OK=24.0 FORECAST_HIGH=25.08 \
                   LAST_YEAR_H1=15.6772998986 DISCLOSE_DATE=2026-08-28
          fi
          python verify_h1.py

      - name: 存档核验结果回仓库
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive/ || true
          git commit -m "h1 verify $(date -u +%Y-%m-%d)" || echo "无新提交"
          git push origin main || echo "push失败（不影响推送）"
